project:
  type: book
  output-dir: docs

book:
  title: "Introduction to Econometrics with R"
  author: ["[Osman Doğan](https://sites.google.com/view/osmandogan/home)", "[Süleyman Taşpınar](https://sites.google.com/site/gcsuleymantaspinar/)"]
  date: "today"
  repo-url: https://github.com/osmdogan/datasets.git
  repo-actions: [edit, issue]
  site-url: https://osmdogan.github.io/Python_Book/
  cover-image: CoverR2.png
  page-footer:
    left: |
      Introduction to Econometrics with Python was written by Osman Doğan and Süleyman Taşpınar.
    right: |
      This book was built with <a href="https://quarto.org/">Quarto</a>.
 
  chapters:
    - index.qmd

    - part: Part0-RBasics.qmd
      chapters: 
        - Chapter0-IntroR.qmd
        - Chapter0-DataStructures.qmd
        - Chapter0-ControlStructure.qmd
        - Chapter0-CustomFunctions.qmd
        - Chapter0-StatFunctions.qmd
        - Chapter0-Graphics.qmd
        - Chapter0-Dataframes.qmd
        - Chapter0-NumericalAnalysis.qmd
        - Chapter0-OOP.qmd

    - part: Part1-IntroductionReview.qmd
      chapters:
        - Chapter1-EconomicQuestion.qmd
        - Chapter2-ReviewProbability.qmd
        - Chapter3-ReviewStatistics.qmd

    - part: Part2-FundamentalRegressionAnalysis.qmd
      chapters:
        - Chapter4-LinearRegressionOneRegressor.qmd
        - Chapter5-LinearRegressionOneRegressorInference.qmd
        - Chapter6-MultipleRegression.qmd
        - Chapter7-MultipleRegressionInference.qmd
        - Chapter8-NonlinearRegressions.qmd
        - Chapter9-AssessingStudies.qmd

    - part: Part3-FurtherTopics.qmd
      chapters:
        - Chapter10-RegressionPanelData.qmd
        - Chapter11-BinaryDependentVariable.qmd
        - Chapter12-IVRegression.qmd
        - Chapter13-Experiments.qmd
        - Chapter14-BigData.qmd

    - part: Part4-TimeSeriesData.qmd
      chapters:
        - Chapter15-TimeSeriesRegression.qmd
        - Chapter16-DynamicCausalEffects.qmd
        - Chapter17-AdditionalTopicsTimeSeries.qmd
 
    - part: Part5-TheoreticalTopics.qmd
      chapters:
        - Chapter18-TheoryRegression.qmd
        - Chapter19-TheoryMultipleRegression.qmd

  appendices:
    - AppendixA.qmd
    - AppendixB.qmd
    - AppendixC.qmd
    - AppendixD.qmd
    - references.qmd
      
bibliography: references.bib

format:
  html:
    theme: 
     - cosmo
     - r4ds.scss
    code-link: true
    toc: true
    toc-location: right
    toc-title: "Table of Contents"
    toc-depth: 3
    number-sections: true
    include-in-header:
      - file: "macros.jax"
   
     


  
